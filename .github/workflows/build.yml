name: Build IPA

on:
  workflow_dispatch:

# 需要寫入權限，才能建立 Release 並附上 IPA
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project Browser.xcodeproj \
            -scheme Browser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Browser.app Payload/
          zip -qr Browser.ipa Payload

      # 直接把 IPA 附在 Release 上：下載到的就是 Browser.ipa，不會再包一層 zip
      - name: Publish IPA to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Browser.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "Browser ${TAG}" \
            --notes "Unsigned IPA built from commit ${GITHUB_SHA:0:7}"
